
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma carte de profil</title>

    <!-- Liaison avec le fichier CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Carte de profil -->
    <article class="profile-card">

        <!-- Photo de profil -->
        <img src="image.png"
             alt="Photo de profil"
             class="profile-photo">

        <!-- Nom -->
        <h2>Martinien Ola</h2>

        <!-- Rôle -->
        <p class="role">Développeur Web Junior</p>

        <!-- Biographie -->
        <p class="bio">
            Passionné par le développement web et mobile.
            J'aime apprendre et créer de nouvelles applications.
        </p>

        <!-- Bouton -->
        <button type="button">Voir mon profil</button>

    </article>

</body>
</html>
